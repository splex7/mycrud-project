<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>팀 관리 (CRUD)</title>
</head>
<body>
  <h2>팀 관리</h2>
  <label>팀 이름: <input type="text" id="teamName"></label>
  <label>팀원: <input type="text" id="members"></label>
  <button onclick="addTeam()">추가</button>

  <table border="1" id="teamTable">
    <thead>
      <tr>
        <th>팀 이름</th>
        <th>팀원</th>
        <th>수정</th>
        <th>삭제</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadTeams() {
      const res = await fetch("/teams");
      const teams = await res.json();
      const tbody = document.querySelector("#teamTable tbody");
      tbody.innerHTML = "";
      teams.forEach((t, i) => {
        const row = `<tr>
          <td>${t.name}</td>
          <td>${t.members}</td>
          <td><button onclick="editTeam(${t.id})">수정</button></td>
          <td><button onclick="deleteTeam(${t.id})">삭제</button></td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    async function addTeam() {
      const name = document.getElementById("teamName").value;
      const members = document.getElementById("members").value;
      await fetch("/teams", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, members })
      });
      loadTeams();
    }

    async function editTeam(id) {
      const newName = prompt("새로운 팀 이름:");
      const newMembers = prompt("새로운 팀원:");
      if (newName && newMembers) {
        await fetch(`/teams/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: newName, members: newMembers })
        });
        loadTeams();
      }
    }

    async function deleteTeam(id) {
      await fetch(`/teams/${id}`, { method: "DELETE" });
      loadTeams();
    }

    loadTeams();
  </script>
</body>
</html>
